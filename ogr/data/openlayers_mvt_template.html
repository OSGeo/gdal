<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no' />
    <title>%(xml_escaped_title)s</title>

    <!-- OpenLayers -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.6.1/ol.css">
    <script src="https://cdn.jsdelivr.net/npm/ol@10.6.1/dist/ol.js"></script>

    <style>
        body { margin:0; padding:0; }
        body, table, tr, td, th, div, h1, h2, input, label { font-family: "Calibri", "Trebuchet MS", "Ubuntu", Serif; font-size: 11pt; }
        #map { position:absolute; top:0; bottom:0; width:100%; background: white; } /* full size */
        .ctl {
            position: absolute;
            padding: 2px 10px 2px 10px;
            background: white;
            background: rgba(255,255,255,0.9);
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 5px;
            text-align: right;
        }
        .title {
            top: 10px;
            right: 10px;
            font-size: 18pt;
            font-weight: bold;
        }
        .src {
            bottom: 10px;
            left: 10px;
            font-size: 10pt;
        }
        .layers {
            top: 60px;
            right: 10px;
            text-align: left;
            padding: 6px 10px;
        }
        .layers label { display: block; }
        .layers hr { margin: 4px 0; border: 0; border-top: 1px solid #ccc; }

    </style>

</head>
<body>

<div id="map"></div>

<script>
/* **** OpenLayers **** */

// Base layers
//  .. OpenStreetMap
var osm = new ol.layer.Tile({
    source: new ol.source.OSM({maxZoom: %(maxzoom)s})
});

//  .. CartoDB Positron
var cartodb = new ol.layer.Tile({
    source: new ol.source.XYZ({
        url: 'https://{a-d}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png',
        attributions: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, &copy; <a href="https://carto.com/attribution">CartoDB</a>',
        maxZoom: %(maxzoom)s
    }),
    visible: false
});

//  .. White background: no basemap, the map background is white

// Overlay layer
// Data extent (west, south, east, north) in the view projection (EPSG:3857)
var extent = ol.proj.transformExtent([%(west)s, %(south)s, %(east)s, %(north)s], 'EPSG:4326', 'EPSG:3857');

// Only tiles of zoom levels [minzoom, maxzoom] intersecting the data extent are
// requested. Beyond maxzoom, tiles of maxzoom are overzoomed.
var lyr = new ol.layer.VectorTile({
    source: new ol.source.VectorTile({
        format: new ol.format.MVT(),
        url: './{z}/{x}/{y}.%(tileformat)s',
        attributions: "%(copyright)s",
        tileGrid: ol.tilegrid.createXYZ({minZoom: %(minzoom)s, maxZoom: %(maxzoom)s}),
        extent: extent
    })
});

// Map
var map = new ol.Map({
    target: 'map',
    layers: [osm, cartodb, lyr],
    view: new ol.View({
        center: ol.proj.fromLonLat([%(centerlon)s, %(centerlat)s]),
        zoom: %(beginzoom)s,
        maxZoom: %(maxzoom)s
    })
});

var basemaps = {"OpenStreetMap": osm, "CartoDB Positron": cartodb, "Without background": null}
var overlaymaps = {"Layer": lyr}

function addControl(className, html) {
    var div = document.createElement('div');
    div.className = 'ctl ' + className;
    div.innerHTML = html;
    map.addControl(new ol.control.Control({element: div}));
    return div;
}

// Title
addControl('title', "%(double_quote_escaped_title)s");

// Note
var src = 'Generated by <a href="https://gdal.org/en/stable/programs/ogr2ogr.html">ogr2ogr</a>';
addControl('src', src);

// Add base layers
var layersDiv = addControl('layers', '');
Object.keys(basemaps).forEach(function(name, i) {
    var label = document.createElement('label');
    var input = document.createElement('input');
    input.type = 'radio';
    input.name = 'basemap';
    input.checked = (i === 0);
    input.addEventListener('change', function() {
        Object.keys(basemaps).forEach(function(other) {
            if (basemaps[other]) basemaps[other].setVisible(other === name);
        });
    });
    label.appendChild(input);
    label.appendChild(document.createTextNode(' ' + name));
    layersDiv.appendChild(label);
});
layersDiv.appendChild(document.createElement('hr'));
Object.keys(overlaymaps).forEach(function(name) {
    var label = document.createElement('label');
    var input = document.createElement('input');
    input.type = 'checkbox';
    input.checked = true;
    input.addEventListener('change', function() {
        overlaymaps[name].setVisible(input.checked);
    });
    label.appendChild(input);
    label.appendChild(document.createTextNode(' ' + name));
    layersDiv.appendChild(label);
});

// Fit to overlay bounds
map.getView().fit(extent);

</script>

</body>
</html>
