name: Linux Builds

on:
    push:
        paths-ignore:
            - 'doc/**'
            - 'docker/**'
        branches-ignore:
            - 'backport**'
            - 'dependabot**'
    pull_request:
        paths-ignore:
            - 'doc/**'
            - 'docker/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  linux-build:

    # Store the components of the container name as environment variables:
    # ${CONTAINER_REGISTRY}/${CONTAINER_REGISTRY_USER}/${CONTAINER_NAME}:${CONTAINER_TAG}
    #
    # Additionally, CACHE_CONTAINER_TAG may be used as as source for the
    # Docker build cache. So if the Dockerfile in a feature branch is
    # unchanged relative to master, a full container rebuild should not
    # be required.
    env:
      CONTAINER_REGISTRY: ${{ vars.gdal_container_registry || 'ghcr.io' }}
      CONTAINER_REGISTRY_USER: ${{ vars.gdal_container_registry_user || github.repository_owner }}
      CONTAINER_NAME: gdal-deps
      CONTAINER_TAG: ${{ matrix.container }}-${{ github.base_ref || github.ref_name }}
      CACHE_CONTAINER_TAG: ${{ matrix.container }}-master

    permissions:
      packages: write

    strategy:
      fail-fast: false
      matrix:
        #   Matrix variables:
        #
        #   * name : readable summary of configuration, used for display
        #   * id : used as a ccache key, and to create a build subdirectory
        #   * container : build environment container and path to build script
        #   * use_avx2 : if true, determine arch at runtime and use in ccache key
        #   * build_script : name of custom build script, if any. Will be executed
        #                    inside container, from build subdirectory.
        #   * before_test_script : name of script to run before tests, if any.
        #                          Will be executed outside container, from
        #                          workspace root. Can be used to start docker
        #                          containers as services for testing.
        #   * test_script : name of custom test script, if any. Will be executed
        #                   inside container, from build subdirectory.
        #   * travis_branch : value of TRAVIS_BRANCH environment variable,
        #                     used for test skipping
        include:
          - name: Alpine, gcc
            id: alpine
            container: alpine
            build_script: build.sh
            os: ubuntu-22.04

          - name: Alpine, clang 32-bit
            id: alpine_32bit
            container: alpine_32bit
            build_script: build.sh
            test_script: test.sh
            travis_branch: alpine_32bit
            os: ubuntu-22.04

          - name: Fedora Rawhide, clang++
            id: fedora_rawhide
            travis_branch: fedora_rawhide
            container: fedora_rawhide
            build_script: build.sh
            test_script: test.sh
            os: ubuntu-22.04

          - name: Ubuntu 26.04, gcc
            id: ubuntu_26.04
            travis_branch: ubuntu_2604
            container: ubuntu_26.04
            before_test_script: services.sh
            build_script: build.sh
            test_script: test.sh
            os: ubuntu-24.04

          - name: Ubuntu 26.04, clang ASAN
            id: asan
            travis_branch: sanitize
            container: ubuntu_26.04
            build_script: build.sh
            test_script: test.sh
            os: ubuntu-24.04

          - name: Ubuntu 22.04, gcc
            id: ubuntu_22.04
            travis_branch: ubuntu_2204
            container: ubuntu_22.04
            before_test_script: services.sh
            build_script: build.sh
            test_script: test.sh
            os: ubuntu-22.04

          - name: Ubuntu 20.04, gcc
            id: ubuntu_20.04
            travis_branch: ubuntu_2004
            container: ubuntu_20.04
            use_avx2: true
            build_script: build.sh
            test_script: test.sh
            os: ubuntu-22.04

          - name: Ubuntu 20.04, coverage
            id: coverage
            travis_branch: ubuntu_2004
            container: ubuntu_20.04
            before_test_script: services.sh
            build_script: build.sh
            test_script: test.sh
            os: ubuntu-22.04

          - name: Ubuntu 20.04, benchmarks
            id: benchmarks
            travis_branch: ubuntu_2004
            container: ubuntu_20.04
            build_script: build.sh
            test_script: test.sh
            os: ubuntu-22.04

          - name: Ubuntu 22.04, Intel compiler
            id: icc
            container: icc
            travis_branch: ubuntu_2204
            build_script: build.sh
            os: ubuntu-22.04

          - name: Ubuntu 24.04, s390x
            id: s390x
            container: s390x
            travis_branch: s390x
            build_script: build.sh
            test_script: test.sh
            os: ubuntu-22.04

          - name: Ubuntu 24.04, armhf (32 bit)
            id: armhf
            container: armhf
            build_script: build.sh
            test_script: test.sh
            os: ubuntu-22.04

    name: ${{ matrix.name }}

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        # bash is needed to use ${CONTAINER_REGISTRY_USER,,}, which forces the
        # username to lower-case as required by docker.
        shell: bash

    steps:
      - name: Set variables
        # This logic needs to be kept in sync between linux_build.yml and converity_scan.yml
        run: |
          CONTAINER_TAG_CLEAN=$(echo ${CONTAINER_TAG} | tr -d -c "[:alnum:].-")
          echo "CONTAINER_TAG_CLEAN=${CONTAINER_TAG_CLEAN}"
          echo "CONTAINER_TAG_CLEAN=${CONTAINER_TAG_CLEAN}" >> ${GITHUB_ENV}
          CACHE_CONTAINER_TAG_CLEAN=$(echo ${CACHE_CONTAINER_TAG} | tr -d -c "[:alnum:].-")
          echo "CACHE_CONTAINER_TAG_CLEAN=${CACHE_CONTAINER_TAG_CLEAN}"
          echo "CACHE_CONTAINER_TAG_CLEAN=${CACHE_CONTAINER_TAG_CLEAN}" >> ${GITHUB_ENV}
          echo "CONTAINER_NAME_FULL=${CONTAINER_REGISTRY}/${CONTAINER_REGISTRY_USER,,}/${CONTAINER_NAME}:${CONTAINER_TAG_CLEAN}"  >>${GITHUB_ENV}

      # Work around segfaults in ASan/MSan jobs
      # Cf https://github.com/libjpeg-turbo/libjpeg-turbo/commit/2dfe6c0fe9e18671105e94f7cbf044d4a1d157e6
      # and https://github.com/actions/runner-images/issues/9491
      - name: Set up build
        run: |
          sudo sysctl vm.mmap_rnd_bits=28

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to Docker Hub
        if: env.CONTAINER_REGISTRY == 'docker.io'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}   # zizmor: ignore[secrets-outside-env]
          password: ${{ secrets.DOCKERHUB_TOKEN }}   # zizmor: ignore[secrets-outside-env]

      - name: Login to GHCR
        if: env.CONTAINER_REGISTRY == 'ghcr.io'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $ --password-stdin

      - name: Enable Docker qemu
        shell: bash -l {0}
        run: |
          docker run --rm --privileged linuxkit/binfmt:v0.8

        # Pull build environment in forks or pull requests, unless [skip cache] is included in the commit message
      - name: Pull build environment
        if: "(github.repository_owner != 'OSGeo' || github.event_name == 'pull_request') && !contains(github.event.head_commit.message, '[skip cache]')"
        run: |
          docker pull ${CONTAINER_REGISTRY}/osgeo/${CONTAINER_NAME}:${CONTAINER_TAG_CLEAN} || true
          docker pull ${CONTAINER_REGISTRY}/osgeo/${CONTAINER_NAME}:${CACHE_CONTAINER_TAG_CLEAN} || true
          docker pull ${CONTAINER_NAME_FULL} || true
          echo "DOCKER_BUILD_CACHE_FROM=--cache-from ${CONTAINER_REGISTRY}/osgeo/${CONTAINER_NAME}:${CONTAINER_TAG_CLEAN} --cache-from ${CONTAINER_REGISTRY}/osgeo/${CONTAINER_NAME}:${CACHE_CONTAINER_TAG_CLEAN} --cache-from ${CONTAINER_NAME_FULL}" >>${GITHUB_ENV}

      - name: Prepare build context
        run: |
          mkdir docker-build-context
          cp autotest/requirements.txt docker-build-context

      - name: Update build environment
        env:
          DOCKER_BUILDKIT: 1
        run: |
          # FIXME: for some reason, the fedora rawhide container pushed by
          # master job is corrupted (looks like it contains an outdated layer
          # symlinking libssl.so.3 to an older version of the actual file),
          # once it is pushed. But in the job that generates it,
          # compilation & tests work fine. It looks like some weird caching
          # issue
          if test "${{ matrix.container }}" = "fedora_rawhide"; then
            DOCKER_BUILD_CACHE_FROM=""
          else
            BUILD_ARG_INLINE_CACHE="--build-arg BUILDKIT_INLINE_CACHE=1"
          fi
          docker build \
            ${BUILD_ARG_INLINE_CACHE} \
            ${DOCKER_BUILD_CACHE_FROM} \
            -t ${CONTAINER_NAME_FULL} \
            -f .github/workflows/${{ matrix.container }}/Dockerfile.ci \
            docker-build-context

      # Get the architecture so we can use it as part of the cache key,
      # but only if we are going to use avx2 in the build. If we are not,
      # including the arch will cause unnecessary cache misses.
      - name: Get Architecture
        id: get-arch
        if: matrix.use_avx2
        run: |
            export ARCH=$(cc -march=native -### -E - < /dev/null 2>&1 | sed -ne 's/.*cc1 .*-march=\([^ "]*\)[ "].*/\1/p')
            echo "Architecture: $ARCH"
            echo "arch=$ARCH" >> $GITHUB_OUTPUT

      # cache the .ccache directory
      # key it on the runner os, build type, deps, and arch
      # It's especially important to include arch in the key because we
      # may get runtime errors with -mavx2 from objects built on a
      # different architecture.
      - name: Restore build cache
        id: restore-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ matrix.id }}-${{ steps.get-arch.outputs.arch }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ matrix.id }}-${{ steps.get-arch.outputs.arch }}-${{ github.ref_name }}-
            ${{ matrix.id }}-${{ steps.get-arch.outputs.arch }}-

      - name: Prepare ccache
        run: |
          mkdir -p ${{ github.workspace }}/.ccache
          chmod -R a+rw ${{ github.workspace }}/.ccache
          docker run --rm \
            -v ${{ github.workspace }}/.ccache:/.ccache \
            -u $(id -u ${USER}):$(id -g ${USER}) \
            ${CONTAINER_NAME_FULL} \
            sh -c "ccache -M 1G && ccache -sp && ccache -z"

        # FIXME the default BUILD_CMD here isn't working...we get an error
        # about the quotes not matching.
      - name: Build
        env:
          TRAVIS: yes
          TRAVIS_BRANCH: ${{ matrix.travis_branch }}
          BUILD_NAME: ${{ matrix.travis_branch }}
        run: |
          if test -f ".github/workflows/${{ matrix.id }}/${{ matrix.build_script }}"; then
            BUILD_CMD="$(pwd)/.github/workflows/${{ matrix.id }}/${{ matrix.build_script }}"
          else
            BUILD_CMD="sh -c 'cmake .. && make -j$(nproc)'"
          fi

          # For cache
          mkdir -p .gdal
          mkdir -p .cargo

          mkdir -p build-${{ matrix.id }}
          docker run --name gdal-build \
            --rm \
            -e CI \
            -e GITHUB_WORKFLOW \
            -e TRAVIS \
            -e TRAVIS_BRANCH \
            -e BUILD_NAME \
            -e "GDAL_SOURCE_DIR=$(pwd)" \
            -u $(id -u ${USER}):$(id -g ${USER}) \
            -v $(pwd)/.gdal:/.gdal:rw \
            -v $(pwd)/.cargo:/.cargo:rw \
            -v $(pwd):$(pwd):rw \
            -v ${{ github.workspace }}/.ccache:/.ccache:rw \
            --workdir $(pwd)/build-${{ matrix.id }} \
            ${CONTAINER_NAME_FULL} \
            ${BUILD_CMD}

      - name: Summarize ccache
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/.ccache:/.ccache \
            -u $(id -u ${USER}):$(id -g ${USER}) \
            ${CONTAINER_NAME_FULL} \
            ccache -s

      - name: Save build cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # Do not write to cache on pull_request events to prevent cache poisoning.
        # Fork PRs can otherwise overwrite shared cache keys used by main branch runs
        # and as we have "packages: write" that could potentially lead to compromising
        # our gdal-deps Docker images.
        if: github.event_name != 'pull_request'
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ steps.restore-cache.outputs.cache-primary-key }}

      - name: Start test services
        if: matrix.before_test_script
        run: |
            .github/workflows/${{ matrix.id }}/${{ matrix.before_test_script }}

        # --security-opt seccomp=unconfined, so that the userfaulfd syscall is availabledocker run \
      - name: Run tests
        env:
          TRAVIS: yes
          TRAVIS_BRANCH: ${{ matrix.travis_branch }}
          BUILD_NAME: ${{ matrix.travis_branch }}
        run: |
          if test -f ".github/workflows/${{ matrix.id }}/${{ matrix.test_script }}"; then
            TEST_CMD="$(pwd)/.github/workflows/${{ matrix.id }}/${{ matrix.test_script }}"
          else
            TEST_CMD="ctest -V -j $(nproc)"
          fi

          if test "${{ matrix.id }}" = "benchmarks"; then
            if test -f /sys/devices/system/cpu/intel_pstate/no_turbo; then
              echo "Disable TurboBoost"
              echo 1 | sudo tee /sys/devices/system/cpu/intel_pstate/no_turbo
            fi
          fi

          # For cache
          mkdir -p .gdal
          mkdir -p .duckdb

          docker run \
            -e CI \
            -e GITHUB_WORKFLOW \
            -e TRAVIS \
            -e TRAVIS_BRANCH \
            -e BUILD_NAME \
            -e "GDAL_SOURCE_DIR=$(pwd)" \
            -u $(id -u ${USER}):$(id -g ${USER}) \
            --security-opt seccomp=unconfined \
            --add-host=host.docker.internal:host-gateway \
            --rm \
            -v $(pwd)/.gdal:/.gdal \
            -v $(pwd)/.cargo:/.cargo:rw \
            -v $(pwd)/.duckdb:/.duckdb \
            -v $(pwd):$(pwd) \
            --workdir $(pwd)/build-${{ matrix.id }} \
            ${CONTAINER_NAME_FULL} \
            ${TEST_CMD}

      - name: Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        if: ${{ matrix.id == 'coverage' }}
        with:
          format: lcov
          file: build-coverage/gdal_filtered.info
          fail-on-error: false

      - name: Push build environment
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          DOCKER_BUILDKIT: 1
        run: |
          docker push ${CONTAINER_NAME_FULL}

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ matrix.id == 'coverage' }}
        with:
          name: coverage_index.html
          path: build-${{ matrix.id }}/coverage_html/index.html

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ matrix.id == 'coverage' }}
        with:
          name: HTML
          path: build-${{ matrix.id }}/coverage_html/*

      - name: Deploy ssh key (for coverage)
        if: ${{ matrix.id == 'coverage' && github.event_name == 'push' && github.ref_name == 'master' && github.repository == 'OSGeo/gdal' }}
        shell: bash -l {0}
        env:
          GDAL_TEST_COVERAGE_RESULTS_SSH_KEY: ${{ secrets.GDAL_TEST_COVERAGE_RESULTS_SSH_KEY }}   # zizmor: ignore[secrets-outside-env]
        run: |
          mkdir $HOME/.ssh && echo "${GDAL_TEST_COVERAGE_RESULTS_SSH_KEY}" > $HOME/.ssh/id_rsa
          chmod 700 $HOME/.ssh && chmod 600 $HOME/.ssh/id_rsa
          ssh-keyscan -t rsa github.com >> $HOME/.ssh/known_hosts
          eval `ssh-agent -s`
          ssh-add $HOME/.ssh/id_rsa

      - name: Deploy to https://github.com/OSGeo/gdal-test-coverage-results
        if: ${{ matrix.id == 'coverage' && github.event_name == 'push' && github.ref_name == 'master' && github.repository == 'OSGeo/gdal' }}
        shell: bash -l {0}
        run: |
          set -x
          set -e
          mkdir -p output_html/coverage_html
          cp -r $GITHUB_WORKSPACE/build-${{ matrix.id }}/coverage_html/* output_html/coverage_html/
          cd output_html
          git init
          git config user.email "gdal-test-coverage-results-bot@example.com"
          git config user.name "GDAL test coverage results bot"
          git remote add origin git@github.com:gdalautotest-coverage-results/gdalautotest-coverage-results.github.io
          git remote -v
          echo "Results of coverage of GDAL autotest See https://gdalautotest-coverage-results.github.io/coverage_html/index.html" > README.md
          git add -A
          git commit -m "Update with OSGeo/gdal commit $GITHUB_SHA"
          git push -f origin master


  build-linux-ubuntu-noble:
    runs-on: ubuntu-24.04
    env:
      BUILD_NAME: cmake-ubuntu-noble
      CMAKE_UNITY_BUILD: OFF
      CMAKE_OPTIONS: -DUSE_CCACHE=ON
      cache-name: cmake-ubuntu-noble
    steps:
    - name: Checkout GDAL
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Setup cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: cache
      with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-${{ env.cache-name }}-${{ github.base_ref }}${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-${{ env.cache-name }}-${{ github.base_ref }}
            ${{ runner.os }}-${{ env.cache-name }}
    - name: Install dependency
      run: |
        sudo add-apt-repository -y ppa:ubuntugis/ubuntugis-unstable
        sudo apt-get update
        sudo apt-get install -y -q bison libaec-dev libjpeg-dev libgif-dev liblzma-dev libzstd-dev libgeos-dev git \
           libcurl4-gnutls-dev libproj-dev libxml2-dev  libxerces-c-dev libnetcdf-dev netcdf-bin \
           libpoppler-dev libpoppler-private-dev gpsbabel libhdf4-alt-dev libhdf5-serial-dev libpodofo-dev poppler-utils \
           libfreexl-dev unixodbc-dev libwebp-dev liblcms2-2 libcrypto++-dev libkml-dev \
           libmysqlclient-dev libarmadillo-dev wget libfyba-dev libjsoncpp-dev libexpat1-dev \
           libsqlite3-dev libpcre3-dev libspatialite-dev libsfcgal-dev fossil libcairo2-dev libjson-c-dev libdeflate-dev liblz4-dev libblosc-dev libarchive-dev \
           libqhull-dev libcfitsio-dev libopenjp2-7-dev libheif-dev \
           python3-dev libpython3-dev libpython3.12-dev python3.12-dev python3-numpy python3-lxml python3-pyflakes python3-setuptools python3-pip python3-venv \
           python3-pytest swig doxygen texlive-latex-base make cppcheck ccache g++ \
           libpq-dev libpqtypes-dev postgresql-16 postgresql-16-postgis-3 postgresql-client-16 postgresql-16-postgis-3-scripts \
           mono-mcs libmono-system-drawing4.0-cil
        # MSSQL: client side
        # Disabled because of Conflicting values set for option Signed-By regarding source https://packages.microsoft.com/ubuntu/24.04/prod/ noble: /usr/share/keyrings/microsoft-prod.gpg !=
        # curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
        # curl https://packages.microsoft.com/config/ubuntu/24.04/prod.list | sudo tee /etc/apt/sources.list.d/msprod.list
        # sudo apt-get update
        # sudo ACCEPT_EULA=Y apt-get install -y msodbcsql17 unixodbc-dev
        # HANA: client side
        # Install hdbsql tool
        curl -v -j -k -s -L -H "Cookie: eula_3_2_agreed=tools.hana.ondemand.com/developer-license-3_2.txt" https://tools.hana.ondemand.com/additional/hanaclient-latest-linux-x64.tar.gz --output hanaclient-latest-linux-x64.tar.gz \
          && tar -xvf hanaclient-latest-linux-x64.tar.gz \
          && sudo mkdir /usr/sap \
          && sudo ./client/hdbinst -a client --sapmnt=/usr/sap \
          && rm -rf client \
          && rm hanaclient*
        export PATH=/usr/sap/hdbclient:$PATH
        # Download and compile odbc-cpp-wrapper
        sudo apt-get install -y -q cmake
        wget https://github.com/SAP/odbc-cpp-wrapper/archive/refs/tags/v1.1.tar.gz -O odbc-cpp-wrapper.tar.gz \
          && mkdir odbc-cpp-wrapper \
          && tar -xvf odbc-cpp-wrapper.tar.gz -C odbc-cpp-wrapper --strip-components=1 \
          && mkdir odbc-cpp-wrapper/build \
          && cd odbc-cpp-wrapper/build \
          && /usr/bin/cmake .. \
          && make -j 2 \
          && sudo make install \
          && cd ../.. \
          && rm -rf odbc-cpp-wrapper
        sudo ldconfig
        #
        # Install Arrow C++
        sudo apt-get install -y -V ca-certificates lsb-release wget
        wget https://apache.jfrog.io/artifactory/arrow/$(lsb_release --id --short | tr 'A-Z' 'a-z')/apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb
        sudo apt-get install -y -V ./apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb
        sudo apt-get update
        sudo apt-get install -y -V libarrow-dev libparquet-dev libarrow-dataset-dev libarrow-compute-dev
        #
        PYTHON_CMD=python3 && $PYTHON_CMD -m pip install -r $GITHUB_WORKSPACE/autotest/requirements.txt

    - name: Build libjxl
      run: |
        # Build libjxl
        # libjxl being still unstable, if the main branch fails to compile/test
        # you can replace JXL_TREEISH=main by JXL_TREEISH=sha1_of_known_working_commit
        JXL_TREEISH=main
        git clone https://github.com/libjxl/libjxl.git --recursive \
            && cd libjxl \
            && git checkout ${JXL_TREEISH} \
            && mkdir build \
            && cd build \
            && sudo apt-get install -y --no-install-recommends libgflags-dev libbrotli-dev \
            && /usr/bin/cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DJPEGXL_FORCE_SYSTEM_BROTLI:BOOL=ON -DJPEGXL_ENABLE_JPEGLI_LIBJPEG=OFF -DCMAKE_INSTALL_PREFIX=/usr .. \
            && make -j$(nproc) \
            && sudo make -j$(nproc) install \
            && cd ../.. \
            && rm -rf libjxl

    - name: Build libQB3
      run: |
        # Build libQB3
        # Used by the MRF driver
        git clone https://github.com/lucianpls/QB3.git \
            && mkdir QB3/QB3lib/build \
            && cd QB3/QB3lib/build \
            && /usr/bin/cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr .. \
            && make -j$(nproc) \
            && sudo make -j$(nproc) install \
            && cd ../../.. \
            && rm -rf QB3

    - name: Build libbasisu
      run: |
        # Used by the BASISU and KTX2 drivers
        git clone -b cmake https://github.com/rouault/basis_universal.git \
            && mkdir basis_universal/build \
            && cd basis_universal/build \
            && /usr/bin/cmake -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr .. \
            && make -j$(nproc) \
            && sudo make -j$(nproc) install \
            && cd ../..\
            && rm -rf basis_universal

    - name: Install pdfium
      run: |
        wget -q https://github.com/rouault/pdfium_build_gdal_3_13/releases/download/pdfium_7724_v1/install-ubuntu2404-rev7724.tar.gz \
          && tar -xzf install-ubuntu2404-rev7724.tar.gz \
          && sudo chown -R root:root install \
          && sudo mv install/lib/* /usr/lib/ \
          && sudo mv install/include/* /usr/include/ \
          && sudo rm -rf install-ubuntu2404-rev7724.tar.gz install \
          && sudo apt-get update -y \
          && sudo apt-get install -y --fix-missing --no-install-recommends liblcms2-dev
    - name: Configure ccache
      run: |
          echo CCACHE_BASEDIR=$PWD >> ${GITHUB_ENV}
          echo CCACHE_DIR=$PWD/.ccache >> ${GITHUB_ENV}
          echo CCACHE_MAXSIZE=250M >> ${GITHUB_ENV}
          ccache -z
      working-directory: ${{ github.workspace }}
    - name: Configure
      run: |
        export PATH=$CMAKE_DIR:/usr/local/bin:/usr/bin:/bin # Avoid CMake config from brew etc.
        mkdir -p $GITHUB_WORKSPACE/superbuild
        cd $GITHUB_WORKSPACE/superbuild
        printf "cmake_minimum_required(VERSION 3.16)\nproject(test)\nenable_testing()\nadd_subdirectory(gdal)" > CMakeLists.txt
        ln -s .. gdal
        mkdir build
        cd build
        cmake  ${CMAKE_OPTIONS} -Werror=dev -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/install-gdal -DCMAKE_UNITY_BUILD=${CMAKE_UNITY_BUILD} -DCMAKE_C_FLAGS=-Werror -DCMAKE_CXX_FLAGS=-Werror -DGDAL_USE_PUBLICDECOMPWT:BOOL=ON -DPUBLICDECOMPWT_URL=https://github.com/rouault/PublicDecompWT .. -DWERROR_DEV_FLAG="-Werror=dev"
    - name: Build
      run: |
        cmake --build $GITHUB_WORKSPACE/superbuild/build -- -j$(nproc)
      env:
        GIT_LFS_SKIP_SMUDGE: 1 # for PublicDecompWT github repository clone
    - name: Build fake ossfuzz fuzzers
      run: |
        cd $GITHUB_WORKSPACE/superbuild/build
        g++ -c $GITHUB_WORKSPACE/fuzzers/fuzzingengine.cpp
        ar r libFuzzingEngine.a fuzzingengine.o
        CXX=g++ CXXFLAGS="${CXXFLAGS} -I$PWD/gdal/port -I$PWD/gdal/gcore -L$PWD" LIBGDAL="-L$PWD/gdal -lgdal" SRC=/tmp OUT=/tmp $GITHUB_WORKSPACE/fuzzers/build_google_oss_fuzzers.sh
        OUT=/tmp $GITHUB_WORKSPACE/fuzzers/build_seed_corpus.sh
    - name: test autotest/cpp/gdallimits
      run: |
        sudo apt-get install -y numactl
        #
        echo "Limits without restrictions:"
        LD_LIBRARY_PATH=$GITHUB_WORKSPACE/superbuild/build $GITHUB_WORKSPACE/superbuild/build/gdal/autotest/cpp/gdallimits
        #
        echo "Limits with ulimit -m 100000; numactl -C 0"
        (ulimit -m 100000; LD_LIBRARY_PATH=$GITHUB_WORKSPACE/superbuild/build numactl -C 0 $GITHUB_WORKSPACE/superbuild/build/gdal/autotest/cpp/gdallimits) > out.txt
        cat out.txt
        grep "CPLGetNumCPUs = 1" out.txt >/dev/null
        grep "CPLGetUsablePhysicalRAM = 97 MB" out.txt >/dev/null
    - name: test (with command targets)
      run: |
        cmake --build $GITHUB_WORKSPACE/superbuild/build --target quicktest -- -j$(nproc)
    - name: test (with ctest)
      run: |
        cd $GITHUB_WORKSPACE/superbuild/build
        ctest -V
    - name: install and uninstall
      run: |
        cmake --build $GITHUB_WORKSPACE/superbuild/build --target install -- -j$(nproc)
        cmake --build $GITHUB_WORKSPACE/superbuild/build --target uninstall
        find $GITHUB_WORKSPACE/install-gdal || /bin/true
    - name: install
      run: |
        export PATH=$CMAKE_DIR:/usr/local/bin:/usr/bin:/bin # Avoid CMake config from brew etc.
        touch $GITHUB_WORKSPACE/man/man1/gdalinfo.1
        touch $GITHUB_WORKSPACE/man/man1/gdaladdo.1
        (cd $GITHUB_WORKSPACE/superbuild/build; cmake ..)
        cmake --build $GITHUB_WORKSPACE/superbuild/build --target install -- -j$(nproc)
        test -f $GITHUB_WORKSPACE/install-gdal/share/man/man1/gdalinfo.1
        test -f $GITHUB_WORKSPACE/install-gdal/share/man/man1/gdaladdo.1
        export LD_LIBRARY_PATH=$GITHUB_WORKSPACE/install-gdal/lib
        $GITHUB_WORKSPACE/install-gdal/bin/gdalinfo --version
        PYTHONPATH=$GITHUB_WORKSPACE/install-gdal/local/lib/python3.12/dist-packages python3 -c "from osgeo import gdal;print(gdal.VersionInfo(None))"
        # Test fix for https://github.com/conda-forge/gdal-feedstock/issues/995
        PYTHONWARNINGS="error" PYTHONPATH=$GITHUB_WORKSPACE/install-gdal/local/lib/python3.12/dist-packages python3 -c "from osgeo import gdal"
        PYTHONPATH=$GITHUB_WORKSPACE/install-gdal/local/lib/python3.12/dist-packages python3 $GITHUB_WORKSPACE/scripts/check_doc.py
    - name: CMake with rpath
      run: |
        export PATH=$CMAKE_DIR:/usr/local/bin:/usr/bin:/bin # Avoid CMake config from brew etc.
        (cd $GITHUB_WORKSPACE/superbuild/build; cmake .. "-DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/install-gdal-with-rpath" -DGDAL_SET_INSTALL_RELATIVE_RPATH=ON)
        cmake --build $GITHUB_WORKSPACE/superbuild/build --target install -- -j$(nproc)
        readelf -d $GITHUB_WORKSPACE/install-gdal-with-rpath/lib/libgdal.so | grep RUNPATH | grep "\$ORIGIN"
        readelf -d $GITHUB_WORKSPACE/install-gdal-with-rpath/bin/gdal | grep RUNPATH | grep "\$ORIGIN:\$ORIGIN/../lib"
        # For some reason, during the install phase of above invocation, the Python bindings are rebuilt after the build phase, and without the rpath... Can't reproduce that locally
        # PYTHONPATH=$GITHUB_WORKSPACE/install-gdal-with-rpath/lib/python3.12/site-packages python -c "from osgeo import gdal;print(gdal.VersionInfo(None))"
    - name: Standalone Python bindings build from source
      run: |
        (cd $GITHUB_WORKSPACE/superbuild/build/gdal/swig/python && python setup.py sdist)
        mv $GITHUB_WORKSPACE/superbuild/build/gdal/swig/python/dist/GDAL-*.tar.gz gdal-python.tar.gz
        mv $GITHUB_WORKSPACE/superbuild/build/gdal/swig/python gdal-swig-python
        python3 -m venv myvenv
        source myvenv/bin/activate
        # Set PATH so that gdal-config is found
        PYTHON_CMD=python3 && PATH=$GITHUB_WORKSPACE/install-gdal/bin:$PATH $PYTHON_CMD -m pip uninstall numpy
        PYTHON_CMD=python3 && PATH=$GITHUB_WORKSPACE/install-gdal/bin:$PATH $PYTHON_CMD -m pip install numpy==1.26.4
        PYTHON_CMD=python3 && PATH=$GITHUB_WORKSPACE/install-gdal/bin:$PATH $PYTHON_CMD -m pip install gdal-python.tar.gz[numpy]
        LD_LIBRARY_PATH=$GITHUB_WORKSPACE/install-gdal/lib python -c "from osgeo import gdal_array"
        which gdal_edit
        cp $GITHUB_WORKSPACE/autotest/gcore/data/byte.tif .
        LD_LIBRARY_PATH=$GITHUB_WORKSPACE/install-gdal/lib ldd myvenv/lib/python3.12/site-packages/osgeo/_gdal.cpython-312-x86_64-linux-gnu.so
        LD_LIBRARY_PATH=$GITHUB_WORKSPACE/install-gdal/lib gdal_edit byte.tif -mo FOO=BAR
        rm -f myvenv/bin/gdal_edit
        rm -f myvenv/bin/gdal_edit.py
    - name: Standalone gdal-utils package from wheel
      run: |
        mv gdal-swig-python $GITHUB_WORKSPACE/superbuild/build/gdal/swig/python
        (cd $GITHUB_WORKSPACE/superbuild/build/gdal/swig/python/gdal-utils && python3 setup.py bdist_wheel)
        mv $GITHUB_WORKSPACE/superbuild/build/gdal/swig/python/gdal-utils/dist/*.whl gdal_utils-X.Y.Z.T-py3-none-any.whl
        rm -rf $GITHUB_WORKSPACE/superbuild/build/gdal/swig/python
        python3 -m venv myvenv
        source myvenv/bin/activate
        # Set PATH so that gdal-config is found
        PYTHON_CMD=python3 && PATH=$GITHUB_WORKSPACE/install-gdal/local/bin:$PATH $PYTHON_CMD -m pip install gdal_utils-X.Y.Z.T-py3-none-any.whl
        which gdal_edit
        cp $GITHUB_WORKSPACE/autotest/gcore/data/byte.tif .
        LD_LIBRARY_PATH=$GITHUB_WORKSPACE/install-gdal/lib gdal_edit byte.tif -mo FOO=BAR
        pip uninstall -y gdal-utils
    - name: Test post-install usage (with pkg-config)
      run: |
        ./autotest/postinstall/test_pkg-config.sh $GITHUB_WORKSPACE/install-gdal
    - name: Test post-install usage (with gdal-config)
      run: |
        ./autotest/postinstall/test_gdal-config.sh $GITHUB_WORKSPACE/install-gdal
    - name: Test post-install usage (with CMake)
      run: |
        ./autotest/postinstall/test_cmake.sh $GITHUB_WORKSPACE/install-gdal
    - name: Rerun with static linkage
      run: |
        export PATH=$CMAKE_DIR:/usr/local/bin:/usr/bin:/bin # Avoid CMake config from brew etc.
        cd $GITHUB_WORKSPACE/superbuild/build
        rm -f CMakeCache.txt
        cmake  ${CMAKE_OPTIONS} .. \
          -DBUILD_SHARED_LIBS=OFF \
          -DBUILD_TESTING=OFF \
          -DCSHARP_MONO=OFF \
          -DGDAL_USE_HDF4=OFF \
          -DGDAL_USE_HDF5=OFF \
          -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/install-gdal-static
        cmake --build $GITHUB_WORKSPACE/superbuild/build --target install -- -j$(nproc)
    - name: Test post-install usage (static, with pkg-config)
      run: |
        ./autotest/postinstall/test_pkg-config.sh $GITHUB_WORKSPACE/install-gdal-static --static
    - name: Test post-install usage (static, with gdal-config)
      run: |
        ./autotest/postinstall/test_gdal-config.sh $GITHUB_WORKSPACE/install-gdal-static --static
    - name: Test post-install usage (static, with CMake)
      run: |
        ./autotest/postinstall/test_cmake.sh $GITHUB_WORKSPACE/install-gdal-static --static
    - name: ccache statistics
      run: ccache -s

